<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planche des chats</title>
<style>
  html, body { margin: 0; background: #dfe9ef; font: 13px system-ui, sans-serif; color: #223; }
  #grid { position: relative; }
  canvas { display: block; }
  .lab { position: absolute; transform: translateX(-50%); background: rgba(255,255,255,.82); border-radius: 6px; padding: 1px 6px; white-space: nowrap; font-weight: 600; }
</style>
</head>
<body>
<div id="grid"></div>
<script type="module">
// Planche des races, robes, chatons et poses des chats (outil de mise au point, hors du jeu) :
// npx vite, puis http://localhost:5173/tools/chat/planche.html ; window.planche.show({ cells: [...] }) (voir plus bas).
// Chaque case montre le chat réaliste (catReal.js) ou, avec proc: true, le chat sculpté par le code (catModel.js et
// catAnim.js : l'AVANT des comparaisons), dans la même lumière et au même cadrage.
import * as THREE from 'three';
import { loadModel } from '/src/game/assets.js';
import { buildRealCatModel, REAL_CAT_KEYS } from '/src/game/models/catReal.js';
import { buildCatModel } from '/src/game/models/catModel.js';
import { animateCat } from '/src/game/catAnim.js';
import { catLookWithBreed } from '/src/sim/catLook.js';
import { SPECIES } from '/src/sim/species.js';
import { resolveLook } from '/src/sim/animal.js';
import { buildGear } from '/src/game/gearModels.js';
import { buildAccessories } from '/src/game/models/salon.js';

const grid = document.getElementById('grid');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setScissorTest(true);
grid.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xdfefff, 0x6b7d4a, 1.25));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.set(2.5, 5, 3.5);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -1, right: 1, top: 1, bottom: -1 });
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x8fb46a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 60);

// Pose du chat procédural (catAnim.js) : une fausse entité, la pose imposée, quelques secondes pour s'y fondre.
const PROC_POSE = { stand: 'stand', sit: 'sit', groom: 'groom', lie: 'loaf', curl: 'curl', eat: 'crouch', highfive: 'highfive', stretch: 'stretch', walk: 'move', run: 'move', jump: 'stand', balance: 'move' };
function procPose(md, cell, stage) {
  const e = {
    model: md, speed: 0, scale: 1, time: 3.3, phase: 0, sleeping: false, state: 'idle', stage, legLift: 0,
    data: { weight: 50, needs: { energy: 80 }, personality: 'calm' }, catPoseOverride: PROC_POSE[cell.clip ?? 'stand'] ?? 'stand',
  };
  const mv = cell.clip === 'walk' ? 0.6 : cell.clip === 'run' ? 4 : cell.clip === 'balance' ? 0.45 : 0;
  e.speed = mv;
  if (cell.clip === 'curl') e.sleeping = true;
  const dt = 1 / 30;
  for (let k = 0; k < 150; k++) {
    e.time += dt;
    animateCat(e, dt, false);
  }
  md.root.updateMatrixWorld(true);
}

// Pose du chat réaliste : posture tenue (staticPose) ou clip tenu à une fraction t de sa durée, pieds au sol comme en
// jeu (allures et saut : relevés seulement, les temps de suspension restent).
function realPose(md, cell) {
  const a = md.anim;
  const clip = cell.clip ?? 'stand';
  const posture = { stand: 'stand', sit: 'sit', lie: 'lie', curl: 'curl' }[clip];
  if (posture && cell.t === undefined && !cell.following && !cell.fear) {
    md.staticPose(posture);
    return;
  }
  const name = { stand: 'idle', lie: 'lie', curl: 'sleep' }[clip] ?? clip;
  for (const nm of a.names) {
    a.w[nm] = nm === name ? 1 : 0;
    a.actions[nm].setEffectiveWeight(a.w[nm]);
    a.actions[nm].time = nm === name ? (cell.t ?? 0) * a.actions[nm].getClip().duration : 0;
    a.actions[nm].timeScale = 1;
  }
  a.posture = { idle: 'stand', sit: 'sit', groom: 'groom', lie: 'lie', sleep: 'curl', eat: 'crouch' }[name] ?? 'stand';
  a.restorePose();
  a.mixer.update(0);
  a.savePose();
  for (const [b, d] of a.shift) b.position.add(d);
  const moving = ['walk', 'trot', 'run', 'jump', 'balance'].includes(name);
  const st = { moving, v: 0, sleeping: name === 'sleep', sad: false, following: !!cell.following, fear: !!cell.fear, posture: a.posture };
  a.overlay(0, st, true);
  a.gait = name === 'walk' || name === 'trot' || name === 'balance' ? name : 'run';
  if (name === 'jump') a.trick = { clip: 'jump', w: 1, time: cell.t ?? 0.5, age: 0 };
  a.ground(st);
  a.trick = null;
  md.root.updateMatrixWorld(true);
}

const breeds = SPECIES.cat.breeds;
window.planche = {
  breeds: breeds.map((b) => b.id),
  /**
   * cells : [{ breed, color (indice de robe), stage ('adult' | 'baby' | 'young'), proc (chat procédural), clip ('stand',
   * 'sit', 'groom', 'lie', 'curl', 'eat', 'highfive', 'jump', 'stretch', 'walk', 'trot', 'run', 'balance'), t (fraction),
   * view ('side' | 'three' | 'front' | 'head' | 'back' | 'top' | 'face' | 'profile' : tête de profil), label, lod, zoom, magenta (faces arrière), following, fear, gear
   * (buildGear : { neck: { item: 'collar', color } }), acc (buildAccessories), probe (centre des yeux en pixels :
   * window.probes) }] ; cols ;
   * cw, ch (taille d'une case).
   */
  async show({ cells, cols = 6, cw = 300, ch = 240 }) {
    await Promise.all(Object.values(REAL_CAT_KEYS).map((k) => loadModel(k)));
    const rows = Math.ceil(cells.length / cols);
    renderer.setSize(cols * cw, rows * ch);
    grid.querySelectorAll('.lab').forEach((e) => e.remove());
    const times = [];
    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      const stage = c.stage ?? 'adult';
      const look = resolveLook('cat', c.breed, c.color ?? 0);
      look.seed = 1234 + i * 17;
      const t0 = performance.now();
      const md = c.proc ? buildCatModel(look) : buildRealCatModel(catLookWithBreed(look, c.breed), stage);
      times.push(performance.now() - t0);
      const sg = new THREE.Group();
      const s = (look.scale ?? 1) * (stage === 'baby' ? 0.55 : stage === 'young' ? 0.85 : 1);
      sg.scale.setScalar(s);
      sg.add(md.root);
      scene.add(sg);
      if (c.lod && md.setLod) md.setLod(1, false);
      // (mise au point : faces arrière en magenta — un trou ou une peau retournée se voient)
      if (c.magenta) {
        for (const m of [md.coatMesh, md.lidMesh, md.eyeMesh]) {
          const mat = m?.material;
          if (!mat) continue;
          const prev = mat.onBeforeCompile;
          const key = mat.customProgramCacheKey?.bind(mat);
          mat.onBeforeCompile = (sh, r) => {
            prev?.call(mat, sh, r);
            sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', '#include <dithering_fragment>\nif (!gl_FrontFacing) gl_FragColor = vec4(1.0, 0.0, 1.0, 1.0);');
          };
          mat.customProgramCacheKey = () => (key ? key() : '') + '-bf';
          mat.side = THREE.DoubleSide;
          mat.needsUpdate = true;
        }
      }
      // (mise au point : pelage sans le shader de la robe, pièces cachées)
      if (c.plain) md.coatMesh.material = new THREE.MeshStandardMaterial({ color: 0x999999 });
      for (const k of c.hide ?? []) {
        const m = { coat: md.coatMesh, eye: md.eyeMesh, lid: md.lidMesh, tuft: md.tuftMesh }[k];
        if (m) m.visible = false;
        if (k === 'shells') for (const sm of md.shells ?? []) sm.visible = false;
      }
      // (mise au point : uniformes de la robe imposés, ex. { cPoint: [1, 1] })
      for (const [k, v] of Object.entries(c.uniforms ?? {})) {
        const u = md.uniforms?.[k];
        if (u && Array.isArray(v)) u.value.fromArray(v);
        else if (u) u.value = v;
      }
      if (c.proc) procPose(md, c, stage);
      else realPose(md, c);
      // équipement (collier, accessoires du salon : { neck: { id: 'bandana', color } }) une fois posé
      if (c.gear) buildGear(md, look, c.gear);
      if (c.acc) buildAccessories(md, look, c.acc);
      md.root.updateMatrixWorld(true);
      if (c.proc && stage === 'baby') md.head.scale.setScalar(1.3);
      const col = i % cols;
      const row = Math.floor(i / cols);
      const y = (rows - 1 - row) * ch;
      renderer.setViewport(col * cw, y, cw, ch);
      renderer.setScissor(col * cw, y, cw, ch);
      camera.aspect = cw / ch;
      const H = 0.26 * s;
      const view = c.view ?? 'three';
      const dist = 1.15 * s * (c.zoom ?? 1);
      const tgt = new THREE.Vector3(0, H * 0.55, 0);
      if (view === 'side') camera.position.set(dist, H * 0.6, 0.01);
      else if (view === 'front') camera.position.set(dist * 0.3, H * 0.7, dist * 0.98);
      else if (view === 'back') camera.position.set(-dist * 0.55, H * 0.85, -dist * 0.85);
      else if (view === 'top') camera.position.set(0.01, dist * 1.2, 0.02);
      else if (view === 'head' || view === 'face' || view === 'profile') {
        const hp = md.head.getWorldPosition(new THREE.Vector3());
        tgt.copy(hp).add(new THREE.Vector3(0, 0.005 * s, 0.025 * s));
        if (view === 'face') camera.position.copy(tgt).add(new THREE.Vector3(0.02 * s, 0.01 * s, 0.32 * s * (c.zoom ?? 1)));
        else if (view === 'profile') camera.position.copy(tgt).add(new THREE.Vector3(0.32 * s * (c.zoom ?? 1), 0.01 * s, 0.01 * s));
        else camera.position.copy(tgt).add(new THREE.Vector3(0.16 * s, 0.04 * s, 0.24 * s).multiplyScalar(c.zoom ?? 1));
      } else camera.position.set(dist * 0.85, H * 0.95, dist * 0.6);
      camera.fov = c.fov ?? 28;
      camera.updateProjectionMatrix();
      camera.lookAt(tgt);
      scene.background = new THREE.Color(0xdfe9ef);
      renderer.render(scene, camera);
      // (mesures : centre des yeux en pixels de la planche, window.probes[case])
      if (c.probe) {
        const pr = [];
        for (const nm of ['eyeL', 'eyeR']) {
          const b = md.bone(nm);
          if (!b) continue;
          const q = b.getWorldPosition(new THREE.Vector3()).project(camera);
          pr.push({ x: col * cw + ((q.x + 1) / 2) * cw, y: row * ch + ((1 - q.y) / 2) * ch });
        }
        (window.probes ??= {})[i] = pr;
      }
      scene.remove(sg);
      md.dispose?.();
      const lab = document.createElement('div');
      lab.className = 'lab';
      const b = breeds.find((x) => x.id === c.breed);
      lab.textContent = c.label ?? `${b?.name.fr ?? c.breed}${stage === 'baby' ? ' (chaton)' : ''}${c.proc ? ' — avant' : ''}`;
      lab.style.left = `${col * cw + cw / 2}px`;
      lab.style.top = `${row * ch + 4}px`;
      grid.appendChild(lab);
    }
    window.buildMs = times;
    return true;
  },
};
window.ready = true;
</script>
</body>
</html>
