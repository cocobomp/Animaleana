<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planche des moutons</title>
<style>
  html, body { margin: 0; background: #dfe9ef; font: 13px system-ui, sans-serif; color: #223; }
  #grid { position: relative; }
  canvas { display: block; }
  .lab { position: absolute; transform: translateX(-50%); background: rgba(255,255,255,.85); border-radius: 6px; padding: 1px 6px; white-space: nowrap; font-weight: 600; }
</style>
</head>
<body>
<div id="grid"></div>
<script type="module">
// Planche des races, des agneaux, de la toison et des poses des moutons réalistes (outil de mise au point, hors du
// jeu) : npx vite, puis /tools/mouton/planche.html ; window.planche.show({ cells: [...] }) (voir plus bas).
// ?avant=1 : le GLB n'est pas chargé, la planche montre le mouton procédural (le modèle de repli, l'AVANT).
import * as THREE from 'three';
import { loadModel } from '/src/game/assets.js';
import { REAL_SHEEP_KEY } from '/src/game/models/sheepReal.js';
import { buildAnimalModel } from '/src/game/models/animalModel.js';
import { SPECIES } from '/src/sim/species.js';
import { resolveLook } from '/src/sim/animal.js';

const AVANT = new URLSearchParams(location.search).has('avant');
const grid = document.getElementById('grid');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setScissorTest(true);
grid.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xdfefff, 0x6b7d4a, 1.25));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.set(2.5, 5, 3.5);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 });
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x8fb46a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const camera = new THREE.PerspectiveCamera(28, 1, 0.02, 60);
const breeds = SPECIES.sheep.breeds;
const STAGE_SCALE = { baby: 0.5, young: 0.78, adult: 1 };

window.planche = {
  breeds: breeds.map((b) => b.id),
  /**
   * cells : [{ breed, color (indice de robe), stage ('baby' | 'young' | 'adult'), sex ('f' | 'm'), fleece (0 tondu à
   * 1 pleine), clip, t (fraction du clip), moving (allure : posée comme en jeu, sabots tenus), view ('side' | 'three' |
   * 'front' | 'head' | 'back' | 'low'), zoom, label, lod, frames (images jouées avant la photo, clip en boucle) }] ;
   * cols ; cw, ch (taille d'une case).
   */
  async show({ cells, cols = 6, cw = 300, ch = 240 }) {
    if (!AVANT) await loadModel(REAL_SHEEP_KEY);
    const rows = Math.ceil(cells.length / cols);
    renderer.setSize(cols * cw, rows * ch);
    grid.querySelectorAll('.lab').forEach((e) => e.remove());
    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      const look = { ...resolveLook('sheep', c.breed, c.color ?? 0), seed: 1234 + i * 17 };
      const stage = c.stage ?? 'adult';
      const flags = { lamb: stage === 'baby', young: stage === 'young', sex: c.sex ?? 'f' };
      if (c.fleece !== undefined) flags.fleece = c.fleece;
      const t0 = performance.now();
      const md = buildAnimalModel('sheep', { ...look, ...flags }, c.breed);
      const ms = performance.now() - t0;
      const sg = new THREE.Group();
      const s = (look.scale ?? 1) * (STAGE_SCALE[stage] ?? 1);
      sg.scale.setScalar(s);
      sg.add(md.root);
      scene.add(sg);
      sg.updateMatrixWorld(true);
      if (md.realSheep) {
        if (c.lod) md.setLod(1);
        if (c.cut) md.setCut(c.cut);
        if (c.long !== undefined) md.uniforms.sState.value.z = c.long;
        md.anim.applyFleece(1e9);
        if (c.clip) {
          const a = md.anim;
          const moving = ['walk', 'trot', 'run'].includes(c.clip);
          if (moving || c.frames) {
            // (joué comme en jeu : allure à sa vitesse naturelle, sabots tenus, sol)
            const v = c.v ?? (moving ? a.natural[c.clip] : 0);
            const st = { v, moving, size: s * md.size, posture: ['lie', 'ruminate', 'sleep'].includes(c.clip) ? (c.clip === 'sleep' ? 'sleep' : 'lie') : 'stand',
              action: ['graze', 'eat'].includes(c.clip) ? c.clip : c.clip === 'lamb_play' ? 'play' : c.clip === 'nurse' ? 'nurse' : null, ruminate: c.clip === 'ruminate' };
            const frames = c.frames ?? 90;
            for (let k = 0; k < frames; k++) a.update(1 / 30, st);
            if (c.t !== undefined && moving) {
              // (phase voulue : le clip mené jusqu'à t)
              const act = a.actions[c.clip];
              const T = act.getClip().duration / Math.max(0.05, act.timeScale);
              const want = c.t * act.getClip().duration;
              let guard = 0;
              while (Math.abs(act.time - want) > 0.02 && guard++ < 400) a.update(T / 120, st);
            }
          } else {
            a.clipPose(c.clip, c.t ?? 0);
            const lie = ['lie', 'ruminate', 'sleep', 'lie_down', 'get_up'].includes(c.clip);
            a.posture = lie ? 'lie' : 'stand';
            a.overlay(0, { moving: false, v: 0, posture: a.posture }, true);
            a.ground({ moving: c.clip === 'jump' || c.clip === 'lamb_play' }, 0, c.clip === 'lamb_play' ? 'lamb_play' : null);
          }
        }
      }
      md.root.updateMatrixWorld(true);
      const col = i % cols;
      const row = Math.floor(i / cols);
      const y = (rows - 1 - row) * ch;
      renderer.setViewport(col * cw, y, cw, ch);
      renderer.setScissor(col * cw, y, cw, ch);
      camera.aspect = cw / ch;
      const H = 0.8 * s * (md.size ?? 1);
      const view = c.view ?? 'three';
      const dist = 2.4 * s * (md.size ?? 1) * (c.zoom ?? 1);
      const tgt = new THREE.Vector3(0, H * 0.5, 0);
      if (view === 'side') camera.position.set(dist, H * 0.55, 0.02);
      else if (view === 'front') camera.position.set(dist * 0.3, H * 0.7, dist * 0.95);
      else if (view === 'back') camera.position.set(-dist * 0.55, H * 0.8, -dist * 0.85);
      else if (view === 'low') {
        tgt.set(0, H * 0.25, 0);
        camera.position.set(dist * 0.9, H * 0.12, dist * 0.35);
      } else if (view === 'head') {
        const hp = md.head.getWorldPosition(new THREE.Vector3());
        tgt.copy(hp).add(new THREE.Vector3(0, 0.0, 0.07 * s));
        camera.position.copy(tgt).add(new THREE.Vector3(0.3 * s, 0.06 * s, 0.45 * s));
      } else camera.position.set(dist * 0.85, H * 0.85, dist * 0.6);
      camera.fov = c.fov ?? 28;
      camera.updateProjectionMatrix();
      camera.lookAt(tgt);
      scene.background = new THREE.Color(0xdfe9ef);
      renderer.render(scene, camera);
      scene.remove(sg);
      md.dispose?.();
      const lab = document.createElement('div');
      lab.className = 'lab';
      const b = breeds.find((x) => x.id === c.breed);
      lab.textContent = c.label ?? `${b?.name.fr ?? c.breed}${stage === 'baby' ? ' (agneau)' : stage === 'young' ? ' (jeune)' : ''}`;
      lab.style.left = `${col * cw + cw / 2}px`;
      lab.style.top = `${row * ch + 4}px`;
      grid.appendChild(lab);
      window.lastBuildMs = ms;
    }
    return true;
  },
};
window.ready = true;
</script>
</body>
</html>
