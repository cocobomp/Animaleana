<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planche des vaches</title>
<style>
  html, body { margin: 0; background: #dfe9ef; font: 13px system-ui, sans-serif; color: #223; }
  #grid { position: relative; }
  canvas { display: block; }
  .lab { position: absolute; transform: translateX(-50%); background: rgba(255,255,255,.85); border-radius: 6px; padding: 1px 6px; white-space: nowrap; font-weight: 600; }
</style>
</head>
<body>
<div id="grid"></div>
<script type="module">
// Planche des races, des veaux, des taureaux et des poses des vaches réalistes (outil de mise au point, hors du jeu) :
// npx vite, puis /tools/vache/planche.html ; window.planche.show({ cells: [...] }) (voir plus bas).
// ?avant=1 : les GLB ne sont pas chargés, la planche montre la vache procédurale (le modèle de repli, l'AVANT).
import * as THREE from 'three';
import { loadModel } from '/src/game/assets.js';
import { REAL_COW_KEY, REAL_BULL_KEY, calfNurseSpot, calfTeatPoint, FEED_Y } from '/src/game/models/cowReal.js';
import { buildAnimalModel } from '/src/game/models/animalModel.js';
import { buildGear } from '/src/game/gearModels.js';
import { SPECIES } from '/src/sim/species.js';
import { resolveLook } from '/src/sim/animal.js';

const AVANT = new URLSearchParams(location.search).has('avant');
const grid = document.getElementById('grid');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setScissorTest(true);
grid.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xdfefff, 0x6b7d4a, 1.25));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.set(3.5, 7, 5);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -3.2, right: 3.2, top: 3.2, bottom: -3.2 });
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.045;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x8fb46a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
// (repère du sol : une ligne fine sous les sabots, pour voir un sabot qui flotte ou s'enfonce)
const camera = new THREE.PerspectiveCamera(28, 1, 0.02, 80);
const breeds = SPECIES.cow.breeds;
const STAGE_SCALE = { baby: 0.5, young: 0.78, adult: 1 };
const wood = new THREE.MeshStandardMaterial({ color: 0x9a7650, roughness: 0.9 });

/** Râtelier de la bergerie (equipment.js : foin à 0,62 m) devant la vache. */
function feeder(z, y) {
  const g = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.5), wood);
  box.position.set(0, y - 0.05, z);
  const hay = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.06, 0.42), new THREE.MeshStandardMaterial({ color: 0xd6b65e, roughness: 1 }));
  hay.position.set(0, y, z);
  for (const m of [box, hay]) {
    m.castShadow = m.receiveShadow = true;
    g.add(m);
  }
  return g;
}

function cowOf(c, i) {
  const look = { ...resolveLook('cow', c.breed, c.color ?? 0), seed: 1234 + i * 17 };
  const stage = c.stage ?? 'adult';
  const flags = { calf: stage === 'baby', young: stage === 'young', sex: c.sex ?? 'f', udderFill: c.udder ?? 0.6 };
  const md = buildAnimalModel('cow', { ...look, ...flags }, c.breed);
  const s = (look.scale ?? 1) * (STAGE_SCALE[stage] ?? 1);
  return { md, s, look, stage };
}

function play(md, c, s) {
  if (!md.realCow) return;
  const a = md.anim;
  if (c.lod) md.setLod(1);
  if (!c.clip) return;
  const moving = ['walk', 'trot', 'run'].includes(c.clip);
  const posture = ['lie', 'ruminate', 'sleep'].includes(c.clip) ? (c.clip === 'sleep' ? 'sleep' : 'lie') : 'stand';
  if (moving || c.frames) {
    // (joué comme en jeu : allure à sa vitesse naturelle, sabots tenus, sol, transitions)
    const v = c.v ?? (moving ? a.natural[c.clip] : 0);
    const st = { v, moving, size: s * md.size, posture,
      action: ['graze', 'eat', 'milk', 'brush', 'groom'].includes(c.clip) ? c.clip : c.clip === 'calf_play' ? 'play' : c.clip === 'suckle' ? 'nurse' : null,
      ruminate: c.clip === 'ruminate', moo: c.clip === 'moo', fly: c.clip === 'tail_swish', reachY: c.reachY ?? null, flies: !!c.flies };
    const frames = c.frames ?? 90;
    for (let k = 0; k < frames; k++) {
      a.update(1 / 30, st);
      st.moo = false;
      st.fly = false;
    }
    if (c.t !== undefined && moving) {
      const act = a.actions[c.clip];
      const T = act.getClip().duration / Math.max(0.05, act.timeScale);
      const want = c.t * act.getClip().duration;
      let guard = 0;
      while (Math.abs(act.time - want) > 0.02 && guard++ < 400) a.update(T / 120, st);
    }
  } else {
    a.clipPose(c.clip, c.t ?? 0);
    const lie = ['lie', 'ruminate', 'sleep', 'lie_down', 'get_up'].includes(c.clip);
    a.posture = lie ? 'lie' : 'stand';
    a.applyFleece(1e9);
    a.overlay(0, { moving: false, v: 0, posture: a.posture }, true);
    const air = ['calf_play'].includes(c.clip);
    a.ground({ moving: air }, 0, air ? 'calf_play' : null);
  }
}

window.planche = {
  breeds: breeds.map((b) => b.id),
  /**
   * cells : [{ breed, color, stage ('baby' | 'young' | 'adult'), sex ('f' | 'm'), udder (0-1), clip, t, frames, v,
   * view ('side' | 'three' | 'front' | 'head' | 'back' | 'low' | 'top' | 'hoof'), zoom, fixed, label, lod, halter (licol),
   * flyMask (bonnet anti-mouches), mother (veau qui tète : sa mère est posée à côté), feeder (râtelier devant elle) }] ;
   * cols ; cw, ch.
   */
  async show({ cells, cols = 6, cw = 300, ch = 240 }) {
    if (!AVANT) await Promise.all([loadModel(REAL_COW_KEY), loadModel(REAL_BULL_KEY)]);
    const rows = Math.ceil(cells.length / cols);
    renderer.setSize(cols * cw, rows * ch);
    grid.querySelectorAll('.lab').forEach((e) => e.remove());
    const stats = [];
    const lows = [];
    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      const t0 = performance.now();
      const { md, s, look, stage } = cowOf(c, i);
      const ms = performance.now() - t0;
      const extra = [];
      const sg = new THREE.Group();
      sg.scale.setScalar(s);
      sg.add(md.root);
      scene.add(sg);
      sg.updateMatrixWorld(true);
      play(md, c, s);
      if (c.halter || c.flyMask) {
        const gear = buildGear(md, look, c.flyMask ? { flyMask: { item: 'flyMask', color: 'blue' } } : { halter: { item: 'halter', color: 'red' } });
        extra.push(gear);
      }
      if (c.feeder) {
        const f = feeder((md.noseZ ?? 1.05) * s + 0.1, FEED_Y.penFeeder);
        scene.add(f);
        extra.push(f);
      }
      if (c.mother) {
        // (veau qui tète : sa mère, la mamelle pleine, et lui à sa place, comme en jeu — cowReal.js calfNurseSpot)
        const m = cowOf({ breed: c.breed, color: c.color, udder: 1 }, i + 100);
        m.md.anim.staticPose('stand');
        const mg = new THREE.Group();
        mg.scale.setScalar(m.s);
        mg.add(m.md.root);
        scene.add(mg);
        extra.push(mg);
        const mother = { position: new THREE.Vector3(), heading: 0, scale: m.s, model: m.md };
        const kid = { scale: s, model: md, nurseSide: 1 };
        const spot = new THREE.Vector3();
        sg.rotation.y = calfNurseSpot(kid, mother, spot);
        sg.position.copy(spot);
        mg.updateMatrixWorld(true);
        const teat = calfTeatPoint(kid, mother, new THREE.Vector3());
        const st = { v: 0, moving: false, size: s * md.size, posture: 'stand', action: 'nurse', nurseY: teat.y };
        for (let k = 0; k < 120; k++) {
          sg.updateMatrixWorld(true);
          md.anim.update(1 / 30, st);
          const mw = md.anim.mouthW;
          if (mw) {
            sg.position.x += (teat.x - mw.x) * 0.5;
            sg.position.z += (teat.z - mw.z) * 0.5;
          }
        }
        sg.updateMatrixWorld(true);
        const mw = md.anim.mouthW;
        if (mw) lows.push({ i, teat: mw.distanceTo(teat) });
      }
      md.root.updateMatrixWorld(true);
      // (sabot le plus bas et ventre le plus bas, pour la mesure)
      if (md.realCow) {
        let lo = Infinity;
        for (let l = 0; l < 4; l++) for (const p of md.anim.solePts[l]) lo = Math.min(lo, p.clone().applyMatrix4(md.legs[l].paw.matrixWorld).y);
        lows.push({ i, hoofCm: Math.round(lo * 1000) / 10 });
      }
      const col = i % cols;
      const row = Math.floor(i / cols);
      const y = (rows - 1 - row) * ch;
      renderer.setViewport(col * cw, y, cw, ch);
      renderer.setScissor(col * cw, y, cw, ch);
      camera.aspect = cw / ch;
      const sc = c.fixed ? 1 : s * (md.size ?? 1);
      const H = 1.45 * sc;
      const view = c.view ?? 'three';
      const dist = 4.6 * sc * (c.zoom ?? 1);
      const tgt = new THREE.Vector3(0, H * 0.5, 0);
      if (view === 'side') camera.position.set(dist, H * 0.55, 0.02);
      else if (view === 'front') camera.position.set(dist * 0.3, H * 0.7, dist * 0.95);
      else if (view === 'back') camera.position.set(-dist * 0.55, H * 0.8, -dist * 0.85);
      else if (view === 'top') camera.position.set(dist * 0.2, dist * 1.1, dist * 0.3);
      else if (view === 'low') {
        tgt.set(0, H * 0.22, 0);
        camera.position.set(dist * 0.9, H * 0.1, dist * 0.35);
      } else if (view === 'hoof') {
        tgt.set(0, 0.12 * sc, 0.35 * sc);
        camera.position.set(dist * 0.55, 0.06 * sc, 0.6 * sc);
      } else if (view === 'head') {
        const hp = (md.headBone ?? md.head).getWorldPosition(new THREE.Vector3());
        const k = s * (md.size ?? 1) * (c.zoom ?? 1);
        tgt.copy(hp).add(new THREE.Vector3(0, -0.05 * k, 0.15 * k));
        camera.position.copy(tgt).add(new THREE.Vector3(0.95 * k, 0.2 * k, 1.3 * k));
      } else camera.position.set(dist * 0.85, H * 0.85, dist * 0.6);
      if (c.target) tgt.set(...c.target);
      if (c.cam) camera.position.set(...c.cam);
      camera.fov = c.fov ?? 28;
      camera.updateProjectionMatrix();
      camera.lookAt(tgt);
      scene.background = new THREE.Color(0xdfe9ef);
      renderer.render(scene, camera);
      scene.remove(sg);
      for (const x of extra) x.parent?.remove(x);
      md.dispose?.();
      const lab = document.createElement('div');
      lab.className = 'lab';
      const b = breeds.find((x) => x.id === c.breed);
      lab.textContent = c.label ?? `${b?.name.fr ?? c.breed}${stage === 'baby' ? ' (veau)' : stage === 'young' ? ' (génisse)' : c.sex === 'm' ? ' (taureau)' : ''}`;
      lab.style.left = `${col * cw + cw / 2}px`;
      lab.style.top = `${row * ch + 4}px`;
      grid.appendChild(lab);
      stats.push(Math.round(ms * 10) / 10);
    }
    window.buildMs = stats;
    window.lows = lows;
    return true;
  },
};
window.ready = true;
</script>
</body>
</html>
