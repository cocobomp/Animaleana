<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planche des lapins</title>
<style>
  html, body { margin: 0; background: #dfe9ef; font: 13px system-ui, sans-serif; color: #223; }
  #grid { position: relative; }
  canvas { display: block; }
  .lab { position: absolute; transform: translateX(-50%); background: rgba(255,255,255,.82); border-radius: 6px; padding: 1px 6px; white-space: nowrap; font-weight: 600; }
</style>
</head>
<body>
<div id="grid"></div>
<script type="module">
// Planche des races, robes, lapereaux et poses des lapins (outil de mise au point, hors du jeu) :
// npx vite, puis http://localhost:5173/tools/lapin/planche.html ; window.planche.show({ cells: [...] }) (voir plus bas).
// Chaque case montre le lapin réaliste (rabbitReal.js) ou, avec proc: true, le lapin sculpté par le code
// (animalModel.js et AnimalEntity.animate : l'AVANT des comparaisons), dans la même lumière et au même cadrage.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadModel } from '/src/game/assets.js';
import { buildRealRabbitModel, REAL_RABBIT_KEYS } from '/src/game/models/rabbitReal.js';
import { buildAnimalModel } from '/src/game/models/animalModel.js';
import { AnimalEntity } from '/src/game/AnimalEntity.js';
import { rabbitLookWithBreed } from '/src/sim/rabbitLook.js';
import { SPECIES } from '/src/sim/species.js';
import { resolveLook } from '/src/sim/animal.js';
import { buildAccessories } from '/src/game/models/salon.js';
import { gfx } from '/src/game/gfx.js';

const grid = document.getElementById('grid');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setScissorTest(true);
grid.appendChild(renderer.domElement);
const scene = new THREE.Scene();
// (reflets du ciel comme en jeu, World.js : sans eux, les yeux restent des trous noirs sans éclat)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.3;
scene.add(new THREE.HemisphereLight(0xdfefff, 0x6b7d4a, 1.25));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.set(2.5, 5, 3.5);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -1, right: 1, top: 1, bottom: -1 });
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x8fb46a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 60);

// Pose du lapin procédural (AnimalEntity.animate) : une fausse entité, quelques secondes pour s'y fondre.
function procPose(md, cell, look) {
  const e = {
    model: md, sp: SPECIES.rabbit, speed: 0, scale: 1, time: 3.3, phase: cell.t ? cell.t * 6 : 0.8, lie: 0, sleeping: false, state: 'idle',
    data: { species: 'rabbit', look, weight: 50, needs: { energy: 80 } }, posing: null,
  };
  const clip = cell.clip ?? 'crouch';
  e.speed = clip === 'hop' ? 0.6 : clip === 'lope' ? 1.2 : clip === 'run' ? 3 : 0;
  if (clip === 'sleep' || clip === 'lie') e.sleeping = true;
  if (clip === 'eat') e.state = 'eat';
  const dt = 1 / 30;
  for (let k = 0; k < 90; k++) {
    e.time += dt;
    AnimalEntity.prototype.animate.call(e, dt, false);
  }
  md.root.updateMatrixWorld(true);
}

// Pose du lapin réaliste : posture tenue (staticPose) ou clip tenu à une fraction t de sa durée, pieds au sol comme en
// jeu (allures et sauts : relevés seulement, les temps de suspension restent).
function realPose(md, cell) {
  const a = md.anim;
  const clip = cell.clip ?? 'crouch';
  const posture = { crouch: 'crouch', sit: 'sit', rear: 'rear', lie: 'lie', sleep: 'sleep', held: 'held' }[clip];
  if (posture && cell.t === undefined) {
    md.staticPose(posture);
    return;
  }
  const name = { crouch: 'idle', rear: 'stand' }[clip] ?? clip;
  for (const nm of a.names) {
    a.w[nm] = nm === name ? 1 : 0;
    a.actions[nm].setEffectiveWeight(a.w[nm]);
    a.actions[nm].time = nm === name ? (cell.t ?? 0) * a.actions[nm].getClip().duration : 0;
    a.actions[nm].timeScale = 1;
  }
  a.posture = { idle: 'crouch', sit: 'sit', stand: 'rear', groom: 'groom', lie: 'lie', sleep: 'sleep', eat: 'eat', sniff: 'sniff', hide: 'hide', held: 'held' }[name] ?? 'crouch';
  a.restorePose();
  a.mixer.update(0);
  a.savePose();
  for (const [b, d] of a.shift) b.position.add(d);
  const moving = ['hop', 'lope', 'run', 'jump', 'binky'].includes(name);
  const st = { moving, v: 0, sleeping: name === 'sleep', sad: false, fear: name === 'hide', posture: a.posture };
  a.t = cell.t ? cell.t * 3 : 1;
  a.overlay(0, st, true);
  a.gait = name === 'hop' || name === 'lope' ? name : 'run';
  if (name === 'jump' || name === 'binky') a.trick = { clip: name, w: 1, time: cell.t ?? 0.5, age: 0 };
  if (name !== 'held') a.ground(st);
  a.trick = null;
  md.root.updateMatrixWorld(true);
}

const breeds = SPECIES.rabbit.breeds;
window.planche = {
  breeds: breeds.map((b) => b.id),
  /**
   * cells : [{ breed, color (indice de robe), stage ('adult' | 'baby' | 'young'), proc (lapin procédural), clip ('crouch',
   * 'hop', 'lope', 'run', 'jump', 'sit', 'rear', 'lie', 'sleep', 'groom', 'sniff', 'eat', 'binky', 'hide', 'held'), t
   * (fraction), view ('side' | 'three' | 'front' | 'head' | 'back' | 'top' | 'face'), label, lod, zoom, magenta (faces arrière), acc
   * (buildAccessories), look (champs du look imposés), quality ('low' | 'high') }] ; cols ; cw, ch (taille d'une case).
   */
  async show({ cells, cols = 6, cw = 300, ch = 240 }) {
    await Promise.all(Object.values(REAL_RABBIT_KEYS).map((k) => loadModel(k)));
    const rows = Math.ceil(cells.length / cols);
    renderer.setSize(cols * cw, rows * ch);
    grid.querySelectorAll('.lab').forEach((e) => e.remove());
    const times = [];
    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      const stage = c.stage ?? 'adult';
      const look = { ...resolveLook('rabbit', c.breed, c.color ?? 0), ...(c.look ?? {}) };
      look.seed = 1234 + i * 17;
      if (c.quality) gfx.quality = c.quality;
      const t0 = performance.now();
      const md = c.proc ? buildAnimalModel('rabbit', look, c.breed, null, { procedural: true }) : buildRealRabbitModel(rabbitLookWithBreed(look, c.breed), stage);
      times.push(performance.now() - t0);
      const sg = new THREE.Group();
      const s = (look.scale ?? 1) * (stage === 'baby' ? 0.5 : stage === 'young' ? 0.8 : 1);
      sg.scale.setScalar(s);
      sg.add(md.root);
      scene.add(sg);
      if (c.lod && md.setLod) md.setLod(1);
      // (mise au point : faces arrière en magenta — un trou ou une peau retournée se voient)
      if (c.magenta) {
        for (const m of [md.coatMesh, md.lidMesh, md.eyeMesh]) {
          const mat = m?.material;
          if (!mat) continue;
          const prev = mat.onBeforeCompile;
          const key = mat.customProgramCacheKey?.bind(mat);
          mat.onBeforeCompile = (sh, r) => {
            prev?.call(mat, sh, r);
            sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', '#include <dithering_fragment>\nif (!gl_FrontFacing) gl_FragColor = vec4(1.0, 0.0, 1.0, 1.0);');
          };
          mat.customProgramCacheKey = () => (key ? key() : '') + '-bf';
          mat.side = THREE.DoubleSide;
          mat.needsUpdate = true;
        }
      }
      for (const k of c.hide ?? []) {
        const m = { coat: md.coatMesh, eye: md.eyeMesh, card: md.cardMesh }[k];
        if (m) m.visible = false;
      }
      if (c.proc) procPose(md, c, look);
      else realPose(md, c);
      if (c.acc) buildAccessories(md, look, c.acc);
      md.root.updateMatrixWorld(true);
      if (c.proc && stage === 'baby') md.head.scale.setScalar(1.3);
      const col = i % cols;
      const row = Math.floor(i / cols);
      const y = (rows - 1 - row) * ch;
      renderer.setViewport(col * cw, y, cw, ch);
      renderer.setScissor(col * cw, y, cw, ch);
      camera.aspect = cw / ch;
      const H = 0.24 * s;
      const view = c.view ?? 'three';
      const dist = 1.25 * s * (c.zoom ?? 1);
      const tgt = new THREE.Vector3(0, H * 0.5, 0);
      if (view === 'side') camera.position.set(dist, H * 0.55, 0.01);
      else if (view === 'front') camera.position.set(dist * 0.3, H * 0.7, dist * 0.98);
      else if (view === 'back') camera.position.set(-dist * 0.55, H * 0.85, -dist * 0.85);
      else if (view === 'top') camera.position.set(0.01, dist * 1.2, 0.02);
      else if (view === 'head' || view === 'face') {
        const hp = md.head.getWorldPosition(new THREE.Vector3());
        tgt.copy(hp).add(new THREE.Vector3(0, 0.01 * s, 0.02 * s));
        if (view === 'face') camera.position.copy(tgt).add(new THREE.Vector3(0.03 * s, 0.02 * s, 0.36 * s * (c.zoom ?? 1)));
        else camera.position.copy(tgt).add(new THREE.Vector3(0.2 * s, 0.05 * s, 0.26 * s).multiplyScalar(c.zoom ?? 1));
      } else camera.position.set(dist * 0.85, H * 1.0, dist * 0.6);
      camera.fov = c.fov ?? 28;
      camera.updateProjectionMatrix();
      camera.lookAt(tgt);
      scene.background = new THREE.Color(0xdfe9ef);
      renderer.render(scene, camera);
      scene.remove(sg);
      md.dispose?.();
      const lab = document.createElement('div');
      lab.className = 'lab';
      const b = breeds.find((x) => x.id === c.breed);
      lab.textContent = c.label ?? `${b?.name.fr ?? c.breed}${stage === 'baby' ? ' (lapereau)' : ''}${c.proc ? ' — avant' : ''}`;
      lab.style.left = `${col * cw + cw / 2}px`;
      lab.style.top = `${row * ch + 4}px`;
      grid.appendChild(lab);
    }
    window.buildMs = times;
    return true;
  },
};
window.ready = true;
</script>
</body>
</html>
